name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bağımlılıkları kur
        run: pip install pyaudio keyboard pyinstaller

      - name: EXE oluştur
        run: pyinstaller --onefile --windowed --name VoiceLink --hidden-import pyaudio voice_chat.py

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoiceLink.exe
          generate_release_notes: true